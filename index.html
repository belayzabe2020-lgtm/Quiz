<!doctype html>

<style>
:root{--bg:#F5F6F8;--sf:#fff;--ink:#1B2338;--mute:#5B6478;--line:#DDE1EA;--brand:#0B3D9E;--bi:#fff;--gold:#B7862A;--ok:#1F7A4D;--okb:#E4F3EA;--bad:#B23B2E;--badb:#FBE9E6;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141F;--sf:#1A2133;--ink:#EEF0F6;--mute:#9AA3B8;--line:#2B3550;--brand:#8FA4E8;--bi:#10141F;--gold:#D9A94B;--ok:#5CC48C;--okb:#17332A;--bad:#F08A7B;--badb:#3A1E1B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141F;--sf:#1A2133;--ink:#EEF0F6;--mute:#9AA3B8;--line:#2B3550;--brand:#8FA4E8;--bi:#10141F;--gold:#D9A94B;--ok:#5CC48C;--okb:#17332A;--bad:#F08A7B;--badb:#3A1E1B;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Noto Sans Ethiopic","Nyala","Abyssinica SIL",system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1,h2,.ser{font-family:"Noto Serif Ethiopic","Nyala",serif;font-weight:800;line-height:1.35;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{padding:28px 0 20px;border-bottom:3px solid var(--gold);margin-bottom:20px}
.hero h1{font-size:30px;color:var(--brand)}.hero p{margin:8px 0 0;color:var(--mute);font-size:15px}
.list{display:grid;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;padding:16px;background:var(--sf);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:6px}
.row-t{font:800 19px/1.4 "Noto Serif Ethiopic",serif;display:block}.row-s,.row-n{font-size:14px;color:var(--mute);display:block}.row-n{white-space:nowrap}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 18px}

.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--bi)}
.note{color:var(--mute);font-size:15px;margin:14px 0}
.go{display:block;width:100%;margin-top:18px;padding:15px;border:0;border-radius:6px;background:var(--brand);color:var(--bi);font-weight:600;font-size:18px}

.bst{color:var(--ok)!important;font-weight:600}.rpw{margin-top:10px}.rp{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:14px;color:var(--mute)}.rpm{display:block;margin-top:6px;font-size:14px;color:var(--ok);word-break:break-word}@media(min-width:900px){#app{max-width:780px}body{font-size:18px}.hero h1{font-size:38px}.list.bk{grid-template-columns:1fr 1fr}.q{font-size:22px}}.tag{font-size:13px;font-weight:600;margin-left:6px}.o.ok .tag{color:var(--ok)}.o.bad .tag{color:var(--bad)}

.ft{margin-top:14px;padding-top:10px;font-size:13px}#app{padding:10px 16px 24px}

<script>
window.DATA={"years":[{"name":"ቀዳማይ ፩ኛ ዓመት","sub":"፯ኛ ክፍል","books":[{"title":"ሥርዓተ ቤተ ክርስቲያን","questions":[{"id":1,"chapter":"ምዕራፍ ፩","q":"ዶግማ እና ቀኖናን በተመለከተ ትክክል የሆነው የቱ ነው?","options":["ቀኖና የእምነት መሠረት ሲሆን ዶግማ ዝርዝር አፈጻጸሙ ነው","ዶግማ እምነት ነው፤ ቀኖና እምነትን የምንፈጽምበት ዝርዝር ሥርዓት ነው","ሁለቱም በጊዜ ሲያረጁ በሲኖዶስ የሚሻሻሉ ናቸው","ዶግማ በአጥቢያ ሲወሰን ቀኖና ግን በዓለም አቀፍ ጉባኤ ብቻ ይወሰናል"],"answer":1},{"id":2,"chapter":"ምዕራፍ ፩","q":"ከሚከተሉት ውስጥ በሲኖዶስም ጭምር የማይለወጠው የቱ ነው?","options":["ደብረ ዳሞ ሴቶች አለመግባታቸው","በአንድ ሀገረ ስብከት የተወሰነ ውሳኔ","በአጥቢያ ቤተ ክርስቲያን የሚሠራ ቀኖና","አምስቱ አዕማደ ምሥጢር"],"answer":3},{"id":3,"chapter":"ምዕራፍ ፩","q":"ከቀኖና ባሕርያት ውስጥ ትክክል ያልሆነው የቱ ነው?","options":["በአንድ ጊዜ በአንድ ቦታ የተደነገገ ነው","በቅዱስ ሲኖዶስ ይደነገጋል፣ ይሻሻላልም","ከተገለጠው ሃይማኖታዊ እውነት ጋር አይቃረንም","የሰው ልጅ ከሚችለው በላይ ሸክም አይጭንም"],"answer":0},{"id":4,"chapter":"ምዕራፍ ፩","q":"የቅዱስ ያሬድን ዜማ መጠቀም ከአኀት አብያተ ክርስቲያናት ጋር ሲነጻጸር ምን ዓይነት ልዩነት ነው?","options":["የዶግማ (የሃይማኖት) ልዩነት","የተፈጥሮ ሕግ ልዩነት","የቀኖና (የሥርዓት) ልዩነት","የቅዱሳት መጻሕፍት ቁጥር ልዩነት"],"answer":2},{"id":5,"chapter":"ምዕራፍ ፩","q":"ከሚከተሉት ውስጥ የቤተ ክርስቲያን ሥርዓት ምንጭ ያልሆነው የቱ ነው?","options":["ትውፊት","የሊቃውንት መጻሕፍት","አፈ ታሪክ","ዓለም አቀፋዊና ሀገራዊ ሲኖዶሳት"],"answer":2},{"id":6,"chapter":"ምዕራፍ ፩","q":"በቀኖና ቤተ ክርስቲያን የሐዲስ ኪዳን መጻሕፍት ብዛት ስንት ነው?","options":["፴፭","፵፮","፳፯","፹፩"],"answer":0},{"id":7,"chapter":"ምዕራፍ ፩","q":"ከሚከተሉት ውስጥ ከስምንቱ የሐዲስ ኪዳን የሥርዓት መጻሕፍት የማይቆጠረው የቱ ነው?","options":["ዲድስቅልያ","አብጥሊስ ሲኖዶስ","መጽሐፈ ኪዳን ካልዕ","ፍትሐ ነገሥት"],"answer":3},{"id":8,"chapter":"ምዕራፍ ፩","q":"ፍትሐ ነገሥትን በመጀመሪያ ያጠናቀረው ማን ነው?","options":["አጼ ዘርዐያዕቆብ","ግብጻዊው እብነ እል አሳል","ቅዱስ ዮሐንስ አፈ ወርቅ","ቅዱስ ያሬድ"],"answer":1},{"id":9,"chapter":"ምዕራፍ ፩","q":"በጉባኤ ቁስጥንጥንያ ስንት ቀኖና ተሠርቷል?","options":["፳","፯","፰","፲፪"],"answer":1},{"id":10,"chapter":"ምዕራፍ ፩","q":"የንሥጥሮስን ትምህርት የሚያራምድ ምእመን መወገዝ እንዳለበት የወሰነው የትኛው ጉባኤ ነው?","options":["ጉባኤ ኒቂያ","ጉባኤ ቁስጥንጥንያ","በኢየሩሳሌም የሐዋርያት ሲኖዶስ","ጉባኤ ኤፌሶን"],"answer":3},{"id":11,"chapter":"ምዕራፍ ፩","q":"ከሚከተሉት ውስጥ አፈ ታሪክን የሚወክለው የቱ ነው?","options":["ጅብ የፊት እግሩ የጠመመው ከንፋስ እኩል እሮጣለሁ በማለቱ ነው የሚለው ትረካ","የአንገት ማዕተብ ማሰር","የእጅ መስቀል መሳለም","ማማተብ"],"answer":0},{"id":12," const SK=(y,b)=>'qb|'+y.sub+'|'+b.title;
function best(y,b){try{return JSON.parse(localStorage.getItem(SK(y,b)))}catch(e){return null}}
function saveBest(y,b,pct,right,n){try{const o=best(y,b);if(!o||pct>o.pct)localStorage.setItem(SK(y,b),JSON.stringify({pct,right,n}))}catch(e){}}
function h(t,a,...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a||{})){if(x==='class')e.className=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else if(v!==null)e.setAttribute(x,v)}for(const c of k.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e}
function mount(...n){A.className=W?'wide':'';A.replaceChildren(...n.filter(Boolean));window.scrollTo(0,0)}
function stop(){clearInterval(timer);timer=null}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const tbar=(t,fn)=>h('div',{class:'top'},h('button',{class:'back',onclick:fn},'ተመለስ'),h('h2',{},t));

function home(){W=1;stop();mount(h('header',{class:'hero2'},h('h1',{},h('span',{class:'n64'},'64'),' የእምነት ፈተና'),h('p',{class:'hs'},'የጥያቄ መለማመጃ'),
 h('blockquote',{class:'vs'},'«የምሄድበትን መንገድ ያውቃል፤ ከፈተነኝም በኋላ እንደ ወርቅ እወጣለሁ።»',h('cite',{},'ኢዮብ ፳፫፥፲')),
 h('p',{class:'ds'},'ከመማሪያ መጻሕፍት የተወሰዱ ጥያቄዎች ሲሆኑ፣ ሁሉም ምእመን የሚገለገልበት ነው። በተጨማሪም ለሰንበት ትምህርት ቤት ተማሪዎችና በስደት ሀገር ለሚኖሩ የኦርቶዶክስ ምእመናን የእውቀት ማጠናከሪያ የተዘጋጀ ነው።')),
 h('div',{class:'list yr'},D.years.map(y=>h('button',{class:'row',onclick:()=>books(y)},h('span',{},h('span',{class:'row-t'},y.name),h('span',{class:'row-s'},y.sub)),h('span',{class:'row-n'},g(y.books.length)+' መጻሕፍት')))),
 h('footer',{class:'ft'},h('div',{},'App Creator By EYOB'),h('div',{},'© ፳፻፲፱ ዓ.ም')))}
function books(y){W=1;stop();mount(tbar(y.name,home),h('div',{class:'list bk'},y.books.map(b=>{const s=best(y,b);return h('button',{class:'row',onclick:()=>setup(y,b)},h('span',{},h('span',{class:'row-t'},b.title),h('span',{class:'row-s'},g(b.questions.length)+' ጥያቄዎች')),h('span',{class:'row-n'+(s?' bst':'')},s?'ምርጥ፦ '+s.pct+'%':'አልተሞከረም'))})))}
function setup(y,b){W=0;stop();const len=b.questions.length;let opts=[10,20,32,64].filter(n=>n<len);opts.push(len);let sel=opts.includes(20)?20:len;
 const info=h('p',{class:'note'}),chips=h('div',{class:'chips'});
 const paint=()=>{info.textContent='የተመደበው ጊዜ፦ '+g(sel)+' ደቂቃ (ለአንድ ጥያቄ አንድ ደቂቃ)። መልሶቹ ሁሉንም ከጨረሱ በኋላ ይታያሉ።';chips.replaceChildren(...opts.map(n=>h('button',{class:'chip','aria-pressed':String(n===sel),onclick:()=>{sel=n;paint()}},g(n))))};paint();
 mount(tbar(b.title,()=>books(y)),h('div',{class:'lbl'},'የጥያቄ ብዛት ይምረጡ'),chips,info,h('button',{class:'go',onclick:()=>start(y,b,sel)},'ፈተናውን ጀምር'))}
function start(y,b,n){W=0;stop();const qs=shuffle(b.questions).slice(0,n);st={y,b,qs,n,ans:Array(n).fill(null),i:0,left:n*60,total:n*60,warn:false,quit:false};
 timer=setInterval(()=>{st.left--;const t=document.getElementById('tm');if(t){t.textContent=fmt(st.left);t.classList.toggle('w',st.left<=60)}if(st.left<=0)finish()},1000);renderQ()}
function renderQ(){const{qs,n,i,ans}=st,q=qs[i],un=ans.filter(a=>a===null).length,last=i===n-1;
 const nav=h('div',{class:'nav'},h('button',{class:'go sec',disabled:i===0?'':null,onclick:()=>{st.i--;st.warn=false;renderQ()}},'ቀዳሚ'),
  last?h('button',{class:'go',onclick:()=>{if(un>0&&!st.warn){st.warn=true;renderQ()}else finish()}},st.warn&&un>0?'ቢሆንም ጨርስ':'ጨርስ'):h('button',{class:'go',onclick:()=>{st.i++;st.warn=false;renderQ()}},'ቀጣይ'));
 mount(h('div',{class:'bar'},h('span',{},'ጥያቄ '+g(i+1)+' ከ '+g(n)),h('span',{class:'tm'+(st.left<=60?' w':''),id:'tm'},fmt(st.left))),
  h('div',{class:'pg'},h('i',{style:'width:'+((i+1)/n*100)+'%'})),h('div',{class:'ch'},q.chapter),h('p',{class:'q'},q.q),
  h('div',{class:'opts'},q.options.map((o,k)=>h('button',{class:'op','aria-pressed':String(ans[i]===k),onclick:()=>{st.ans[i]=k;st.warn=false;renderQ()}},h('b',{},LET[k]),h('span',{},o)))),
  nav,st.warn&&un>0?h('p',{class:'warn'},'ያልተመለሱ ጥያቄዎች '+g(un)+' አሉ። ተመልሰው ሊመልሱ ወይም ቢሆንም መጨረስ ይችላሉ።'):null,
  h('button',{class:'quit',onclick:()=>{if(!st.quit){st.quit=true;renderQ();}else{stop();books(st.y)}}},st.quit?'እርግጠኛ ነዎት? እንደገና ይንኩ':'ፈተናውን አቁም'))}
function rep(q){const code=st.y.sub+' / '+st.b.title+' / ጥያቄ '+q.id;const msg=h('span',{class:'rpm'});return h('div',{class:'rpw'},h('button',{class:'rp',onclick:()=>{const t='ስህተት ሪፖርት፦ '+code;msg.textContent=t;try{navigator.clipboard.writeText(t).then(()=>{msg.textContent='ተገልብጧል፦ '+code}).catch(()=>{})}catch(e){}}},'ስህተት ሪፖርት'),msg)}
function finish(){W=0;stop();const{qs,n,ans}=st;const right=qs.filter((q,i)=>ans[i]===q.answer).length,pct=Math.round(right/n*100);saveBest(st.y,st.b,pct,right,n);
 const m=pct>=80?['ጎበዝ!','በጣም አሪፍ ነው፤ ይቀጥሉ።']:pct>=50?['በርታ!','እየተሻሻሉ ነው፤ ትንሽ ተጨማሪ ልምምድ።']:['አሻሽል!','እንደገና ይሞክሩ፤ መጽሐፉን ደግመው ያንብቡ።'];
 const used=Math.max(0,st.total-st.left),box=h('div',{});let only=false;
 const paint=()=>{const tabs=h('div',{class:'tabs'},h('button',{class:'chip','aria-pressed':String(!only),onclick:()=>{only=false;paint()}},'ሁሉም'),h('button',{class:'chip','aria-pressed':String(only),onclick:()=>{only=true;paint()}},'የተሳሳቱ ብቻ'));
  const items=qs.map((q,i)=>({q,i})).filter(({q,i})=>!only||ans[i]!==q.answer).map(({q,i})=>h('div',{class:'rv'},h('p',{class:'q'},g(i+1)+'. '+q.q),
   q.options.map((o,k)=>h('div',{class:'o'+(k===q.answer?' ok':ans[i]===k?' bad':'')},LET[k]+') '+o,k===q.answer?h('span',{class:'tag'},'ትክክል'):ans[i]===k?h('span',{class:'tag'},'የመረጡት'):null)),ans[i]===null?h('p',{class:'warn'},'አልተመለሰም'):null,rep(q)));
  box.replaceChildren(tabs,...(items.length?items:[h('p',{class:'note'},'የተሳሳተ መልስ የለም።')]))};paint();
 mount(h('div',{class:'score'},h('div',{class:'n'},right+' / '+n),h('div',{class:'p'},pct+'%')),h('p',{class:'msg'},m[0]),h('p',{class:'sub'},m[1]+' (ጊዜ፦ '+fmt(used)+')'),
  h('button',{class:'go',onclick:()=>setup(st.y,st.b)},'እንደገና ሞክር'),h('button',{class:'go sec',onclick:()=>books(st.y)},'ወደ መጻሕፍት'),box)}
home();
